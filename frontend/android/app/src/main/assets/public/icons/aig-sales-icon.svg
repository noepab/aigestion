<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient púrpura a magenta -->
    <linearGradient id="salesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Accent dorado -->
    <linearGradient id="salesAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Glow -->
    <filter id="salesGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="256" cy="256" r="236" fill="url(#salesBg)"/>
  
  <!-- Borde luminoso -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#salesAccent)" stroke-width="3" opacity="0.5"/>
  
  <!-- Icono de conexión/handshake estilizado -->
  <g filter="url(#salesGlow)" transform="translate(256,256)">
    <!-- Mano izquierda -->
    <path d="M-80 20 Q-100 0 -80 -20 L-20 -20 Q0 -20 0 0 L0 40 Q0 60 -20 60 L-60 60 Q-80 60 -80 40 Z" fill="url(#salesAccent)" transform="rotate(-15)"/>
    <!-- Mano derecha -->
    <path d="M80 20 Q100 0 80 -20 L20 -20 Q0 -20 0 0 L0 40 Q0 60 20 60 L60 60 Q80 60 80 40 Z" fill="url(#salesAccent)" transform="rotate(15) scale(-1,1)"/>
    <!-- Conexión central -->
    <circle cx="0" cy="10" r="15" fill="#fff" opacity="0.9"/>
  </g>
  
  <!-- Destellos decorativos -->
  <circle cx="380" cy="120" r="8" fill="#fbbf24" opacity="0.6"/>
  <circle cx="420" cy="180" r="5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="130" cy="400" r="6" fill="#fbbf24" opacity="0.5"/>
</svg>
