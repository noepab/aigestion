<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient principal negro a azul oscuro -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Glow central cyan -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <!-- Brand gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c8bf5"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="512" height="512" fill="url(#mainBg)"/>
  
  <!-- Glow central -->
  <circle cx="256" cy="256" r="200" fill="url(#centerGlow)"/>
  
  <!-- Patrón hexagonal sutil -->
  <g opacity="0.08" stroke="#22d3ee" stroke-width="1" fill="none">
    <polygon points="256,80 336,120 336,200 256,240 176,200 176,120"/>
    <polygon points="256,240 336,280 336,360 256,400 176,360 176,280"/>
    <polygon points="96,160 176,200 176,280 96,320 16,280 16,200"/>
    <polygon points="416,160 496,200 496,280 416,320 336,280 336,200"/>
    <polygon points="96,320 176,360 176,440 96,480 16,440 16,360"/>
    <polygon points="416,320 496,360 496,440 416,480 336,440 336,360"/>
  </g>
  
  <!-- Logo "A" central -->
  <g transform="translate(256,256)">
    <path d="M0 -60 L50 60 L30 60 L20 30 L-20 30 L-30 60 L-50 60 L0 -60 Z M0 -20 L-12 20 L12 20 L0 -20 Z" fill="url(#brandGrad)" opacity="0.9"/>
  </g>
  
  <!-- Línea decorativa inferior -->
  <rect x="180" y="340" width="152" height="2" rx="1" fill="url(#brandGrad)" opacity="0.6"/>
</svg>
