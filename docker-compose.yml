version: '3.8'
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "8080:80"
  ml-service:
    build: ./ml-service
    env_file: .env
    ports:
      - "5000:5000"
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  db_data:
